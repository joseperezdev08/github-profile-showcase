name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/api/pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      - name: Install API dependencies
        run: pnpm --dir apps/api install --frozen-lockfile

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Verify API
        run: pnpm --dir apps/api check

      - name: Verify web
        run: pnpm --dir apps/web check
